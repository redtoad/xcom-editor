<svg id="globe"/>

<script type="application/javascript">
	const width = 750;
	const height = 750;
	const config = {
		speed: 0.01,
		verticalTilt: -12,
		horizontalTilt: 0
	};
	const sensitivity = 75;
	let locations = [];
	const svg = d3.select('svg').attr('width', width).attr('height', height);
	const markerGroup = svg.append('g');
	const projection = d3.geoOrthographic().translate([width / 2, height / 2]);
	const initialScale = projection.scale();
	let path = d3.geoPath().projection(projection);
	const center = [width / 2, height / 2];

	drawGlobe();
	drawGraticule();
	enableRotation();

	function drawGlobe() {
		d3.queue()
			.defer(d3.json, '/static/world-110m.json')
			.defer(d3.json, '/locations')
			.await((error, worldData, locationData) => {
				svg.selectAll('.segment')
					.data(topojson.feature(worldData, worldData.objects.countries).features)
					.enter().append('path')
					.attr('class', 'segment')
					.attr('d', path)
					.style('stroke', '#888')
					.style('stroke-width', '1px')
					.style('fill', (d, i) => '#e5e5e5')
					.style('opacity', '.6');
				locations = locationData;
				drawMarkers();
			});
	}

	function drawGraticule() {
		const graticule = d3.geoGraticule()
			.step([10, 10]);

		svg.append('path')
			.datum(graticule)
			.attr('class', 'graticule')
			.attr('d', path)
			.style('fill', '#fff')
			.style('stroke', '#ccc');
	}

	function enableRotation() {
		d3.timer(function (elapsed) {
			projection.rotate([config.speed * elapsed - 10, config.verticalTilt, config.horizontalTilt]);
			svg.selectAll('path').attr('d', path);
			drawMarkers();
		});
	}

	function drawMarkers() {
		const markers = markerGroup.selectAll('circle')
			.data(locations);

		markers.enter()
			.append('circle')
			.merge(markers)
			.attr('cx', d => projection([d.longitude, d.latitude])[0])
			.attr('cy', d => projection([d.longitude, d.latitude])[1])
			.attr('fill', d => {
				const coordinate = [d.longitude, d.latitude];
				const gdistance = d3.geoDistance(coordinate, projection.invert(center));
				return gdistance > 1.5 ? 'none' : 'red';
			})
			.attr('stroke', d => {
				const coordinate = [d.longitude, d.latitude];
				const gdistance = d3.geoDistance(coordinate, projection.invert(center));
				return gdistance > 1.5 ? 'none' : 'white';
			})
			.attr('r', 4);

		markerGroup.each(function () {
			this.parentNode.appendChild(this);
		});
	}

	svg.append('circle').attr('cx', 535).attr('cy', 600).attr('r', 6).style('fill', 'red');
	svg.append('text').attr('x', 545).attr('y', 600).text('X-COM Base').style('font-size', '11px').attr('alignment-baseline', 'middle');
</script>
