<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon of the savegame editor (source of appicon.png). Render with:
     inkscape appicon.svg -w 1024 -h 1024 -o appicon.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05051a"/>
      <stop offset="0.55" stop-color="#14104a"/>
      <stop offset="1" stop-color="#3a0c1c"/>
    </linearGradient>
    <radialGradient id="planet" cx="512" cy="1500" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0.80" stop-color="#5a1408"/>
      <stop offset="0.93" stop-color="#b8341a"/>
      <stop offset="1" stop-color="#f08a3c"/>
    </radialGradient>
    <radialGradient id="glow" cx="512" cy="1500" r="1010" gradientUnits="userSpaceOnUse">
      <stop offset="0.86" stop-color="#ffb060" stop-opacity="0.9"/>
      <stop offset="0.93" stop-color="#ff6a3c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8fff0"/>
      <stop offset="0.45" stop-color="#4cd4b0"/>
      <stop offset="1" stop-color="#127a6a"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8f4"/>
      <stop offset="0.5" stop-color="#9090a8"/>
      <stop offset="1" stop-color="#3c3c50"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0f8ff"/>
      <stop offset="1" stop-color="#4c9cc8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cffd8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9cffd8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="14" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#05051a" filter="url(#tileShadow)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#space)"/>

    <!-- stars -->
    <g fill="#dcdcfc">
      <circle cx="190" cy="210" r="4"/>
      <circle cx="300" cy="160" r="3"/>
      <circle cx="420" cy="240" r="2.5"/>
      <circle cx="230" cy="380" r="3"/>
      <circle cx="160" cy="520" r="2.5"/>
      <circle cx="860" cy="470" r="3"/>
      <circle cx="820" cy="560" r="2.5"/>
      <circle cx="600" cy="170" r="2.5"/>
      <circle cx="880" cy="180" r="3.5"/>
      <circle cx="350" cy="560" r="2"/>
    </g>

    <!-- planet with glowing atmosphere -->
    <circle cx="512" cy="1500" r="1010" fill="url(#glow)"/>
    <circle cx="512" cy="1500" r="900" fill="url(#planet)"/>

    <!-- tractor beam of the UFO -->
    <polygon points="700,330 760,330 860,640 600,640" fill="url(#beam)"/>

    <!-- UFO -->
    <g filter="url(#shadow)" transform="rotate(-12 730 300)">
      <ellipse cx="730" cy="290" rx="62" ry="52" fill="url(#dome)"/>
      <ellipse cx="730" cy="318" rx="170" ry="44" fill="url(#hull)"/>
      <ellipse cx="730" cy="306" rx="170" ry="16" fill="#f4f4fc" opacity="0.5"/>
      <g fill="#f4e444">
        <circle cx="620" cy="326" r="9"/>
        <circle cx="675" cy="336" r="9"/>
        <circle cx="730" cy="340" r="9"/>
        <circle cx="785" cy="336" r="9"/>
        <circle cx="840" cy="326" r="9"/>
      </g>
    </g>

    <!-- the big X -->
    <g filter="url(#shadow)">
      <path d="M262 380 L392 380 L512 530 L632 380 L762 380 L578 612 L762 844 L632 844 L512 694 L392 844 L262 844 L446 612 Z"
            fill="url(#xface)" stroke="#063c34" stroke-width="12" stroke-linejoin="round"/>
      <path d="M282 392 L386 392 L512 550 L638 392 L742 392" fill="none"
            stroke="#ffffff" stroke-opacity="0.7" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
